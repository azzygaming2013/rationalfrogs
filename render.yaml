services:
  - type: web
    name: wr-c2
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --ws auto --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PANEL_PASSWORD
        sync: false
      - key: AGENT_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.6
