<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wr-c2 // access</title>
<link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml">
<style>
  :root{
    --bg:#070a12; --panel:#111726; --line:#1c2334; --line2:#28324a;
    --txt:#e6ebf5; --dim:#7b879e; --dim2:#4b566c; --accent:#6366f1; --ok:#22c55e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(1200px 700px at 50% -20%, #131b2e 0%, transparent 60%), var(--bg);
    color:var(--txt);display:grid;place-items:center;
    font:13px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .card{
    width:360px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:30px 26px 24px;box-shadow:0 40px 110px -30px #000;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);
       box-shadow:0 0 12px #22c55eaa;animation:pulse 2.4s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .brand b{letter-spacing:.2em;font-size:12px;font-weight:700;text-transform:uppercase}
  .brand span.v{margin-left:auto;color:var(--dim2);font-size:10px;letter-spacing:.12em}
  label{display:block;font-size:10px;letter-spacing:.18em;color:var(--dim);
        text-transform:uppercase;margin-bottom:8px}
  input{
    width:100%;padding:12px 13px;background:#080b14;border:1px solid var(--line2);
    border-radius:9px;color:var(--txt);font:inherit;outline:none;transition:.15s;
  }
  input:focus{border-color:#39456b;box-shadow:0 0 0 3px #6366f11f}
  button{
    width:100%;margin-top:16px;padding:12px;border:0;border-radius:9px;cursor:pointer;
    background:linear-gradient(180deg,#7174f5,#5b5ef0);color:#fff;
    font:600 12px/1 "Inter",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;
  }
  button:hover{filter:brightness(1.08)}
  .err{margin-top:14px;color:#ff8b8b;font-size:12px}
  .foot{margin-top:22px;font-size:10.5px;color:var(--dim2);letter-spacing:.06em}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="brand"><span class="dot"></span><b>wr-c2</b><span class="v">v1.1</span></div>
    <label for="p">access key</label>
    <input id="p" name="password" type="password" autocomplete="current-password" autofocus>
    <button type="submit">authenticate</button>
    {% if request.query_params.get('e') %}<div class="err">invalid credentials</div>{% endif %}
    <div class="foot">session expires in 7d</div>
  </form>
</body>
</html>
